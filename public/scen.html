<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syna – scen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body class="stage">
<header><div class="brand">SYNA</div><div class="sub">Släktens egen spelshow</div>
  <nav class="ctls"><a class="ctl" href="/start" target="syna-start">Kom igång</a><a class="ctl" href="/admin" target="syna-vard" data-popup>Värd</a><button class="ctl" id="voice">Slå på husets röst</button></nav>
</header>
<main id="lobby">
  <section class="join">
    <div class="code" id="wificode" hidden>
      <img id="wifiqr" alt="QR-kod till wifi">
      <div class="how">1. Wifi</div>
      <div class="url" id="ssid"></div>
    </div>
    <div class="code">
      <img src="/qr.svg" alt="QR-kod till spelet">
      <div class="how" id="how">Skanna med mobilkameran</div>
      <div class="url" id="url"></div>
    </div>
  </section>
  <section>
    <div class="tiles" id="teams"></div>
    <div class="others" id="others"></div>
    <div class="foot">Väntar på att värden startar.</div>
  </section>
</main>
<section id="game" hidden></section>
<script type="module">
import { connect, esc, popups, runClocks } from '/common.js';
import { stage } from '/syna.js';

const teams = document.getElementById('teams');
const others = document.getElementById('others');
const game = document.getElementById('game');
const voice = document.getElementById('voice');

// Husets röst: webbläsarens talsyntes läser upp uppdraget. Den måste slås på med ett tryck.
let voiceOn = false;
let spoken = '';
function say(text) {
  if (!voiceOn) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'sv-SE';
  u.rate = 0.95;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if (!('speechSynthesis' in window)) voice.hidden = true;
voice.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voice.textContent = voiceOn ? 'Husets röst är på' : 'Slå på husets röst';
  say('Husets röst är på.');
});
function announce(g) {
  const key = `${g.round}:${g.task.id}:${g.step}`;
  if (key === spoken) return;
  spoken = key;
  if (g.step === 'intro') say(`${g.task.name}. ${g.task.text} ${g.task.role}${g.topic ? ` Ämnet är: ${g.topic}.` : ''}`);
  else if (g.step === 'result') say('Tiden är ute.');
  else if (g.step === 'final') say(`Finalen. ${g.final.name}. ${g.final.text}`);
}

fetch('/adress').then((r) => r.text()).then((u) => {
  document.getElementById('url').textContent = u.replace(/^https?:\/\//, '');
});
popups();
// Med ett gästnät inställt visas två koder: först wifi, sedan spelet.
fetch('/wifi').then((r) => r.json()).then(({ ssid }) => {
  if (!ssid) return;
  document.body.classList.add('wifi');
  document.getElementById('wifiqr').src = '/wifi.svg';
  document.getElementById('ssid').textContent = ssid;
  document.getElementById('how').textContent = '2. Spelet';
  document.getElementById('wificode').hidden = false;
}).catch(() => {});

const link = connect('stage', {
  onState(s) {
    const inGame = s.phase === 'game';
    document.body.classList.toggle('ingame', inGame);
    game.hidden = !inGame;
    if (inGame) {
      game.innerHTML = stage(s, link.now());
      announce(s.syna);
      return;
    }
    document.body.classList.toggle('few', s.teams.length <= 4); // få lag: lagen i en kolumn, mer plats åt koderna
    teams.innerHTML = s.teams.map((t) => {
      const ready = t.devices.some((d) => d.online);
      const status = ready ? 'Redo' : t.devices.length ? 'Tappat kontakten' : 'Väntar på mobil';
      return `<div class="tile${ready ? ' ready' : ''}" style="--c:${esc(t.color)}"><div class="n">Lag ${esc(t.name)}</div><div class="s">${status}</div></div>`;
    }).join('');
    const judge = s.judges.some((d) => d.online) ? 'klar' : 'saknas';
    others.textContent = `Publik: ${s.audience.filter((d) => d.online).length}  ·  Kontrollant: ${judge}`;
  },
});
runClocks(link.now);
</script>
</body>
</html>
