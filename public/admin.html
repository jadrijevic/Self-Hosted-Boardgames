<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syna – värd</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
<main id="app"><p class="muted">Ansluter …</p></main>
<script type="module">
import { connect, esc, store, runClocks } from '/common.js';
import { admin as gamePanel, action } from '/syna.js';

const app = document.getElementById('app');
let state = null;
let denied = false;
let armed = ''; // det som kräver två tryck och väntar på det andra: reset, endGame eller undo
let armedFor = ''; // läget som knappen gällde när den trycktes första gången
const stepOf = (s) => JSON.stringify([s?.phase, s?.syna?.round, s?.syna?.step, s?.syna?.back]);
let error = '';

const link = connect('admin', {
  onState(s) {
    // Har spelet gått vidare sedan första trycket gäller det inte längre.
    if (armed && stepOf(s) !== armedFor) armed = '';
    state = s;
    denied = false;
    render();
  },
  onDenied() { denied = true; state = null; render(); },
  onError(e) { error = e; render(); },
});
runClocks(link.now);

const devices = (list, label = '') => list.map((d) => `
  <div class="rowx">
    <div class="grow">${esc(d.name || 'Mobil ' + d.id)} <span class="muted">${label}${d.online ? 'ansluten' : 'ej ansluten'}</span></div>
    <button class="btn ghost" data-do="kick" data-device="${esc(d.id)}">Ta bort</button>
  </div>`).join('');

function render() {
  // Skriv inte över ett fält som värden håller på att fylla i.
  if (document.activeElement?.tagName === 'INPUT' && state && !denied) return;
  if (denied) {
    app.innerHTML = `
      <h1>Värd</h1>
      <form class="card" id="pinform">
        <h2>Pinkod</h2>
        <input name="pin" inputmode="numeric" autocomplete="off" placeholder="Pinkod" required>
        <p class="muted">Glömt koden? Den står i projektets .env på servern. <a href="/start">Startsidan</a> visar hur du hittar den.</p>
        <button class="btn">Logga in</button>
      </form>`;
    return;
  }
  if (!state) return;
  if (state.phase === 'game') {
    app.innerHTML = `<h1>Värd</h1><div class="err">${esc(error)}</div>${gamePanel(state, link.now(), armed)}`;
    return;
  }
  app.innerHTML = `
    <h1>Värd</h1>
    <div class="err">${esc(error)}</div>
    <section class="card">
      <h2>Starta Syna</h2>
      <button class="btn big2" data-do="start">Starta spelet</button>
      <button class="btn ghost" data-do="setMaterial" data-on="${state.settings.material ? 0 : 1}">Uppdrag med material: ${state.settings.material ? 'på' : 'av'}</button>
      <p class="muted">Utan material väljs bara uppdrag som inte kräver några saker.</p>
      <button class="btn ghost" data-do="setPractice" data-on="${state.settings.practice === false ? 1 : 0}">Övningsrond: ${state.settings.practice === false ? 'av' : 'på'}</button>
      <p class="muted">En första rond med Masken som inte räknas. Den lär ut bud och syn.</p>
      <button class="btn ghost" data-do="setLong" data-on="${state.settings.long ? 0 : 1}">Långa uppdrag: ${state.settings.long ? 'på' : 'av'}</button>
      <p class="muted">Väskan och Ryggen tar över fem minuter per rond och är avslagna från början.</p>
    </section>
    <section class="card">
      <h2>Antal lag</h2>
      <div class="step">
        <button class="btn" data-do="teams" data-n="${state.teams.length - 1}">−</button>
        <span>${state.teams.length}</span>
        <button class="btn" data-do="teams" data-n="${state.teams.length + 1}">+</button>
      </div>
      <p class="muted">Två till sex lag. Fyra passar bäst. Med fem eller sex avgör synen mer än uppdragen, och med tre är vinnaren ofta klar i förväg.</p>
    </section>
    ${state.teams.map((t) => `
      <section class="card" style="--c:${esc(t.color)}">
        <div class="rowx">
          <div class="dot"></div>
          <div class="grow"><input value="${esc(t.name)}" maxlength="14" data-team="${esc(t.id)}" aria-label="Lagnamn"></div>
        </div>
        ${devices(t.devices) || '<p class="muted">Ingen mobil ansluten.</p>'}
      </section>`).join('')}
    <section class="card">
      <h2>Publik och kontrollant</h2>
      ${devices(state.judges, 'kontrollant, ') + devices(state.audience, 'publik, ') || '<p class="muted">Ingen ännu.</p>'}
      <p class="muted">Anslutna utan roll: ${state.unseated ?? 0}</p>
    </section>
    <section class="card">
      <h2>Börja om</h2>
      <button class="btn warn" data-do="reset">${armed === 'reset' ? 'Säker? Tryck igen' : 'Nollställ kvällen'}</button>
      <p class="muted">Alla mobiler får välja lag på nytt.</p>
    </section>`;
}

app.addEventListener('submit', (e) => {
  e.preventDefault();
  store.set('pin', new FormData(e.target).get('pin').trim());
  denied = false;
  document.activeElement?.blur();
  link.reconnect();
});

app.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-do]');
  if (!b) return;
  error = '';
  const act = b.dataset.do;
  // Två tryck på samma knapp krävs för det som inte går att ta tillbaka. Ett tryck på något annat avbryter.
  const twice = act === 'reset' || act === 'endGame' || (act === 'undo' && b.dataset.arm);
  const confirmed = twice && armed === act;
  armed = twice && !confirmed ? act : '';
  armedFor = stepOf(state);
  if (act === 'teams') link.send({ t: 'setTeamCount', count: Number(b.dataset.n) });
  else if (act === 'kick') link.send({ t: 'kick', device: b.dataset.device });
  else if (twice) {
    if (confirmed) link.send(act === 'undo' ? action(b.dataset) : { t: act });
    render();
  } else {
    const msg = action(b.dataset);
    if (msg) link.send(msg);
  }
});

app.addEventListener('change', (e) => {
  if (!e.target.dataset.team) return;
  error = '';
  link.send({ t: 'renameTeam', team: e.target.dataset.team, name: e.target.value });
  e.target.blur();
});
</script>
</body>
</html>
